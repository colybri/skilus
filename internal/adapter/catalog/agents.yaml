# Agents supported by skilus. Paths use ${VAR:-default} and a leading ~ for
# the user's home directory. project_dir is relative to the project root.
# Taken from vercel-labs/skills src/agents.ts (MIT, commit 13e4063). Left
# out: agents detected only from the current project (AstrBot, Eve,
# PromptScript, Replit) and the generic .agents/skills entry. Agents that
# share a directory are installed there once; the first one listed is the
# one recorded in the lock.
version: 1
agents:
  - id: claude-code
    name: Claude Code
    project_dir: .claude/skills
    global_dir: ${CLAUDE_CONFIG_DIR:-~/.claude}/skills
    detect: ${CLAUDE_CONFIG_DIR:-~/.claude}
  - id: codex
    name: Codex
    project_dir: .agents/skills
    global_dir: ~/.agents/skills
    detect: ${CODEX_HOME:-~/.codex}
