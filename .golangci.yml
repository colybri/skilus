version: "2"

linters:
  enable:
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - revive
  settings:
    forbidigo:
      # Errors the user may read go through the domain so the CLI can
      # print them in the user's language.
      forbid:
        - pattern: ^fmt\.Errorf$
          msg: usa domain.Errorf para que la CLI traduzca el mensaje
        - pattern: ^errors\.New$
          msg: usa domain.NewError para que la CLI traduzca el mensaje
      analyze-types: true
    misspell:
      # The CLI's message ids are Spanish.
      ignore-rules:
        - comando
        - comandos
        - argumentos
        - dependencias
    errcheck:
      # Writes to the CLI's stdout/stderr; tabwriter reports errors on Flush.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      # Architecture rules: dependencies point inward.
      #   cli -> app -> domain;  adapter -> app, domain;  domain -> stdlib only.
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - github.com/colybri/skilus/internal/domain
          deny:
            - pkg: os
              desc: "domain no hace E/S (regla 2)"
            - pkg: os/exec
              desc: "domain no hace E/S (regla 2)"
            - pkg: net
              desc: "domain no hace E/S (regla 2)"
            - pkg: net/http
              desc: "domain no hace E/S (regla 2)"
        app:
          files:
            - "**/internal/app/**"
          allow:
            - $gostd
            - github.com/colybri/skilus/internal/domain
            - github.com/colybri/skilus/internal/app
          deny:
            - pkg: os/exec
              desc: "app no ejecuta procesos; usa un puerto (regla 7)"
        adapter:
          files:
            - "**/internal/adapter/**"
          deny:
            - pkg: github.com/colybri/skilus/internal/cli
              desc: "los adaptadores no dependen de la CLI (regla 1)"
            - pkg: github.com/spf13/cobra
              desc: "Cobra solo vive en internal/cli (regla 7)"
        cli:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/colybri/skilus/internal/adapter
              desc: "cli solo habla con app; los adaptadores se conectan en cmd/skilus (regla 1)"

  exclusions:
    rules:
      # The CLI translates with its own catalog; message.go is where the
      # domain builds errors; tests may build plain errors.
      - path: (internal/cli/|cmd/|internal/domain/message\.go|_test\.go)
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/colybri/skilus
