name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee test.log && exit 0
          # Job logs are not always at hand (they are served from another
          # host), so the end of the output also goes to annotations.
          grep -v '^ok ' test.log | tail -n 400 | tr -d '\r' | awk '
            { gsub(/%/, "%25"); buf = buf $0 "%0A"; n++ }
            n == 40 { print "::error title=go test::" buf; buf = ""; n = 0 }
            END { if (n) print "::error title=go test::" buf }'
          exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # config verify downloads the JSON schema from golangci-lint.run on
          # every run; when that site is slow, lint fails without linting.
          verify: false

  site:
    # Builds skilus.dev from the working tree, as the pages workflow does
    # from each release tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs --worktree v0.0.0 --out _site
      - run: test -f _site/doc/v0.0.0/en/overview/index.html && test -f _site/doc/en/faq/index.html
      - run: test -f _site/en/index.html && test -f _site/ja/download/index.html && test -f _site/assets/demo/ar.json
      - run: cmp site/install.sh _site/install && cmp site/install.ps1 _site/install.ps1
      - run: shellcheck site/install.sh

  install:
    # Runs the install scripts as skilus.dev serves them, against the newest
    # release on GitHub.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs --worktree v0.0.0 --out _site
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          python3 test/site/serve.py _site 8765 &
          sleep 2
          curl -fsSL http://127.0.0.1:8765/install | SKILUS_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          "$RUNNER_TEMP/bin/skilus" --version
          curl -fsSL http://127.0.0.1:8765/install | SKILUS_VERSION=1.0.0 SKILUS_INSTALL_DIR="$RUNNER_TEMP/old" sh
          "$RUNNER_TEMP/old/skilus" --version | grep -q 'version 1.0.0$'
      - name: install.ps1 with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Start-Process python -ArgumentList 'test/site/serve.py', '_site', '8765' -WindowStyle Hidden
          Start-Sleep 3
          $env:SKILUS_INSTALL_DIR = "$env:RUNNER_TEMP\ps5"
          irm http://127.0.0.1:8765/install.ps1 | iex
          & "$env:RUNNER_TEMP\ps5\skilus.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: install.ps1 with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList 'test/site/serve.py', '_site', '8766' -WindowStyle Hidden
          Start-Sleep 3
          $env:SKILUS_INSTALL_DIR = "$env:RUNNER_TEMP\ps7"
          irm http://127.0.0.1:8766/install.ps1 | iex
          & "$env:RUNNER_TEMP\ps7\skilus.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  release-snapshot:
    # Builds every release archive without publishing, so a broken
    # .goreleaser.yaml is caught before tagging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish

  gate:
    # Instala skills reales y prueba sync, perfiles, search y audit
    # (test/gate/run.sh). Necesita red hacia
    # github.com y skills.sh.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/skilus${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/skilus
      - run: test/gate/run.sh bin/skilus${{ runner.os == 'Windows' && '.exe' || '' }}
        shell: bash
        env:
          # audit asks GitHub about commit signatures; the token only raises
          # the API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
