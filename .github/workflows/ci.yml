name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # config verify downloads the JSON schema from golangci-lint.run on
          # every run; when that site is slow, lint fails without linting.
          verify: false

  release-snapshot:
    # Builds every release archive without publishing, so a broken
    # .goreleaser.yaml is caught before tagging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish

  phase1-gate:
    # Puertas de las fases 1 a 4 (test/gate/run.sh). Necesita red hacia
    # github.com y skills.sh.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/skilus${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/skilus
      - run: test/gate/run.sh bin/skilus${{ runner.os == 'Windows' && '.exe' || '' }}
        shell: bash
        env:
          # audit asks GitHub about commit signatures; the token only raises
          # the API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
